name: publish
run-name: publish ${{ inputs.tag }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 24

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.28.260704
        required: true
        type: string
      sha:
        description: Optional commit SHA that the release tag must point to
        required: false
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release-ref.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          fetch-depth: 0

      - name: Validate release ref
        id: release-ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch --force origin "main:refs/remotes/origin/main"

          _tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          _head_sha="$(git rev-parse HEAD)"
          _release_sha="${RELEASE_SHA:-${_tag_sha}}"

          if [[ "${_tag_sha}" != "${_release_sha}" ]]; then
            echo "${RELEASE_TAG} points to ${_tag_sha}, not ${_release_sha}" >&2
            exit 1
          fi

          if [[ "${_head_sha}" != "${_release_sha}" ]]; then
            echo "Checked out ${_head_sha}, not ${_release_sha}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${_release_sha}" refs/remotes/origin/main; then
            echo "${RELEASE_TAG} commit ${_release_sha} is not reachable from origin/main" >&2
            exit 1
          fi

          echo "sha=${_release_sha}" >> "${GITHUB_OUTPUT}"

  build-frontend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "${GITHUB_ENV}"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-pnpm11-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cache-warmup-${{ runner.os }}-${{ runner.arch }}-pnpm11-node${{ env.NODE_VERSION }}-

      - name: Build frontend assets
        env:
          VITE_APP_VERSION: ${{ inputs.tag }}
          PNPM_CONFIG_MINIMUM_RELEASE_AGE_EXCLUDE: '["@lwmacct/*"]'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Save pnpm cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Restore CI bin cache
        id: ci-bin-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/ci-bin
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-ci-bin-${{ hashFiles('.github/scripts/install-ci-bin.sh') }}

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags='-s -w -linkmode external -extldflags "-static"' \
            -o bin/app .

      - name: Install CI binaries
        run: bash .github/scripts/install-ci-bin.sh .cache/ci-bin

      - name: Compress backend binary
        run: |
          set -euo pipefail
          .cache/ci-bin/upx -9 bin/app
          bin/app version

      - name: Save Go modules and build cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Save CI bin cache
        if: steps.ci-bin-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/ci-bin
          key: ${{ steps.ci-bin-cache.outputs.cache-primary-key }}

      - name: Upload backend binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-backend-bin
          path: bin
          if-no-files-found: error
          retention-days: 1

  build-image:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-frontend
      - build-backend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download frontend assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-frontend-dist
          path: .artifacts/frontend

      - name: Download backend binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-backend-bin
          path: .artifacts/backend

      - name: Prepare image inputs
        run: |
          set -euo pipefail

          rm -rf bin dist
          mkdir -p bin dist

          _backend_app="$(find .artifacts/backend -type f -name app -print -quit)"
          _frontend_root="$(dirname "$(find .artifacts/frontend -type f -name index.html -print -quit)")"

          test -n "${_backend_app}"
          test -n "${_frontend_root}"

          install -m 0755 "${_backend_app}" bin/app
          cp -a "${_frontend_root}/." dist/

          test -x bin/app
          test -f dist/index.html

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Print summary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE_TAGS: ${{ steps.docker-meta.outputs.tags }}
        run: |
          {
            echo "## Publish summary"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Tag | \`${RELEASE_TAG}\` |"
            echo "| Commit | \`${RELEASE_SHA}\` |"
            echo "| Image | \`${REGISTRY}/${IMAGE_NAME}\` |"
            echo
            echo "### Image tags"
            echo
            while IFS= read -r _tag; do
              echo "- \`${_tag}\`"
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Execute remote SSH command
        env:
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          port: ${{ vars.DEPLOY_SSH_PORT }}
          username: ${{ vars.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE }}
          envs: DOCKER_IMAGE
          script: bash ${{ vars.DEPLOY_SCRIPT }}
