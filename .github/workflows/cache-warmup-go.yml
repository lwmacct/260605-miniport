name: cache-warmup-go

on:
  workflow_dispatch:

concurrency:
  group: cache-warmup-go-main
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: main

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags='-s -w -linkmode external -extldflags "-static"' \
            -o bin/app .

      - name: Save Go modules and build cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
