name: release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      npm-cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Prepare npm cache key
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        run: |
          set -euo pipefail
          mkdir -p .cache/npm
          jq 'del(.version) | del(.packages[""].version) | del(.packages[""].name)' \
            package-lock.json > .cache/npm/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Restore npm cache
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        id: npm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-npm-node24-${{ hashFiles('.cache/npm/package-lock.json') }}

      - name: Build frontend assets
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    outputs:
      go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
      ci-bin-cache-hit: ${{ steps.ci-bin-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            cache-warmup-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags='-s -w -linkmode external -extldflags "-static"' \
            -o bin/app .

      - name: Restore CI bin cache
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        id: ci-bin-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/ci-bin
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-ci-bin-${{ hashFiles('.github/scripts/install-ci-bin.sh') }}

      - name: Install CI binaries
        run: bash .github/scripts/install-ci-bin.sh .cache/ci-bin

      - name: Compress backend binary
        run: |
          set -euo pipefail
          .cache/ci-bin/upx -9 bin/app
          bin/app version

      - name: Upload backend binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-backend-bin
          path: bin
          if-no-files-found: error
          retention-days: 1

  cache-warmup:
    name: Cache warmup
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    if: github.ref_type == 'tag' && (needs.build-frontend.outputs.npm-cache-hit != 'true' || needs.build-backend.outputs.go-cache-hit != 'true' || needs.build-backend.outputs.ci-bin-cache-hit != 'true')
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger warm cache workflows
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CACHE_HIT: ${{ needs.build-frontend.outputs.npm-cache-hit }}
          GO_CACHE_HIT: ${{ needs.build-backend.outputs.go-cache-hit }}
          CI_BIN_CACHE_HIT: ${{ needs.build-backend.outputs.ci-bin-cache-hit }}
        run: |
          set -euo pipefail

          if [[ "${NPM_CACHE_HIT}" != "true" ]]; then
            gh workflow run cache-warmup-npm.yml --repo "${GITHUB_REPOSITORY}" --ref main
          fi

          if [[ "${GO_CACHE_HIT}" != "true" ]]; then
            gh workflow run cache-warmup-go.yml --repo "${GITHUB_REPOSITORY}" --ref main
          fi

          if [[ "${CI_BIN_CACHE_HIT}" != "true" ]]; then
            gh workflow run cache-warmup-bin.yml --repo "${GITHUB_REPOSITORY}" --ref main
          fi

  build-image:
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-backend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download frontend assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-frontend-dist
          path: .artifacts/frontend

      - name: Download backend binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-backend-bin
          path: .artifacts/backend

      - name: Prepare image inputs
        run: |
          set -euo pipefail

          rm -rf bin dist
          mkdir -p bin dist

          _backend_app="$(find .artifacts/backend -type f -name app -print -quit)"
          _frontend_root="$(dirname "$(find .artifacts/frontend -type f -name index.html -print -quit)")"

          test -n "${_backend_app}"
          test -n "${_frontend_root}"

          install -m 0755 "${_backend_app}" bin/app
          cp -a "${_frontend_root}/." dist/

          test -x bin/app
          test -f dist/index.html

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Print summary
        run: |
          {
            echo "## Docker build summary"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${REGISTRY}/${IMAGE_NAME}\` |"
            echo "| Version Source | \`${GITHUB_REF_TYPE}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Pushed | ${{ github.ref_type == 'tag' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref_type == 'tag'
    steps:
      - name: Execute remote SSH command
        env:
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          port: ${{ vars.DEPLOY_SSH_PORT }}
          username: ${{ vars.DEPLOY_SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE }}
          envs: DOCKER_IMAGE
          script: bash ${{ vars.DEPLOY_SCRIPT }}
