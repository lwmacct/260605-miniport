name: cache-warmup-bin

on:
  workflow_dispatch:

concurrency:
  group: cache-warmup-bin-main
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: main

      - name: Restore CI bin cache
        id: ci-bin-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/ci-bin
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-ci-bin-${{ hashFiles('.github/scripts/install-ci-bin.sh') }}

      - name: Install CI binaries
        run: bash .github/scripts/install-ci-bin.sh .cache/ci-bin

      - name: Save CI bin cache
        if: steps.ci-bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/ci-bin
          key: ${{ steps.ci-bin-cache.outputs.cache-primary-key }}
