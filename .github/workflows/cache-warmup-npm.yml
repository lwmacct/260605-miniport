name: cache-warmup-npm

on:
  workflow_dispatch:

concurrency:
  group: cache-warmup-npm-main
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: main

      - name: Prepare npm cache key
        run: |
          set -euo pipefail
          mkdir -p .cache/npm
          jq 'del(.version) | del(.packages[""].version) | del(.packages[""].name)' \
            package-lock.json > .cache/npm/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm
          key: cache-warmup-${{ runner.os }}-${{ runner.arch }}-npm-node24-${{ hashFiles('.cache/npm/package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Save npm cache
        if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
