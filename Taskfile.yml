# Taskfile.yml
# https://taskfile.dev
# To enable experimental features
# export TASK_X_FEATURE=1
# export TASK_X_REMOTE_TASKFILES=1
# https://taskfile.dev/docs/experiments/remote-taskfiles

version: "3"
dotenv: [".env", ".env.example", "{{.HOME}}/.env"]

vars:
  TASK_REMOTE: "github.com/lwmacct/251207-task-remote.git//.task"

includes:
  env:
    taskfile: https://{{.TASK_REMOTE}}/env.yml?ref=main
    optional: true
    flatten: true

  git:
    taskfile: https://{{.TASK_REMOTE}}/git.yml?ref=main
    optional: true

  cmd:
    taskfile: .task/cmd.yml
    optional: true

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - npm install

  dev:server:
    desc: Start the Go backend
    cmds:
      - go run . server

  dev:web:
    desc: Start the Vite frontend
    cmds:
      - npm run dev -- --port 40239 --strictPort

  build:server:
    desc: Build backend binary
    cmds:
      - mkdir -p bin
      - go build -o bin/miniport .

  build:web:
    desc: Build frontend
    cmds:
      - npm run build

  build:
    desc: Build frontend and backend
    deps:
      - build:web
      - build:server

  test:
    desc: Run backend tests
    cmds:
      - go list ./... | grep -v '/node_modules/' | xargs go test
