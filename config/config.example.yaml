# 默认配置示例文件, 此文件由单元测试生成, 请勿直接修改
# 复制此文件为 config.yaml 并根据需要修改

# 服务端配置
server:

  # 数据库配置
  db:
    type: "pgsql" # 数据库类型: sqlite 或 pgsql
    sqlite: ".local/data/app.db" # SQLite 数据库文件路径

    # PostgreSQL 数据库连接参数
    pgsql:
      host: "${PGHOST}" # PostgreSQL 主机
      port: "${PGPORT}" # PostgreSQL 端口
      user: "${PGUSER}" # PostgreSQL 用户
      database: "${PGDATABASE}" # PostgreSQL 数据库名
      password: "${PGPASSWORD}" # PostgreSQL 密码

  # HTTP 服务配置
  http:
    listen: ":40238" # HTTP 服务监听地址
    ssl-cert-file: "" # SSL 证书文件路径
    ssl-key-file: "" # SSL 密钥文件路径

  # 本地控制面配置
  control:
    listen: ".local/run/control.sock" # 本地控制命令 Unix socket 路径
