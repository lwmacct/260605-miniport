# 默认配置示例文件, 此文件由单元测试生成, 请勿直接修改
# 复制此文件为 config.yaml 并根据需要修改

# 服务端配置
server:
  debug: false # 启用调试日志和诊断信息

  # 数据库配置
  database:
    type: "sqlite" # 数据库类型：sqlite、pgsql
    sqlite: "${APP_DATA:-.local/data}/sqlite.db" # SQLite 数据库文件路径

    # PostgreSQL 连接参数
    pgsql:
      host: "${PGHOST}" # PostgreSQL 主机
      port: "${PGPORT}" # PostgreSQL 端口
      user: "${PGUSER}" # PostgreSQL 用户名
      database: "${PGDATABASE}" # PostgreSQL 数据库名
      password: "${PGPASSWORD}" # PostgreSQL 密码

  # GitHub App 集成配置
  github:
    enabled: false # 启用 GitHub App 仓库同步
    app-id: 0 # GitHub App ID
    app-slug: "" # GitHub App slug
    private-key-file: "${APP_DATA:-.local/data}/github-app.pem" # GitHub App 私钥 PEM 文件
    webhook-secret: "${GITHUB_APP_WEBHOOK_SECRET}" # GitHub App Webhook 签名密钥
    setup-return-url: "/#/settings/github?github=connected" # GitHub 安装完成后的站内跳转地址
    reconcile-interval: 6h0m0s # GitHub 仓库全量校准周期，0 表示不启用定时校准

  # HTTP 服务配置
  http:
    listen: ":40238" # HTTP 服务监听地址
    web-root: "${WEB_ROOT:-dist}" # 静态 Web 根目录，留空则不托管前端

    # 单用户访问认证配置
    authme:
      path-prefix: "" # 认证 HTTP 路由前缀

      # 允许浏览器访问应用的可信 origin
      origins:
        - http://localhost:40238
        - http://localhost:40239

      # 加密浏览器 Session 配置
      session:

        # Session encryption key ring; first key writes, all keys read
        keys:
          - id: "default" # Session key ID
            secret: "${AUTHME_SESSION_KEY}" # Base64url-encoded 32-byte AES key
        ttl: 24h0m0s # Maximum browser session lifetime
        cookie-name: "" # Optional browser session cookie name

      # 静态 Access Token 认证配置
      statictoken:
        enabled: true # Whether to enable static token authentication
        id: "token" # Authentication method ID
        label: "Access token" # Authentication method display label

        # Static access token credentials
        credentials:
          - id: "operator" # Credential ID
            name: "Operator" # Display name
            token: "${AUTHME_ACCESS_TOKEN}" # Opaque access token

      # Dex GitHub OIDC 认证配置
      dexgithub:
        enabled: true # Whether to enable Dex GitHub authentication
        id: "github" # Authentication method ID
        label: "GitHub" # Authentication method display label
        issuer: "https://2008.s.lwmacct.com:20088" # Dex OIDC issuer URL
        client-id: "260605-miniport" # OIDC client ID
        client-secret: "" # OIDC client secret
        session-ttl: 24h0m0s # Maximum browser session lifetime
        flow-ttl: 5m0s # Login flow lifetime
      allowed-github-user: "lwmacct" # 允许访问应用的唯一 GitHub 用户名

    # HTTPS TLS 配置
    tls:
      enabled: false # 是否启用 HTTPS TLS

      # TLS 证书来源列表
      certificates:
        - id: "default" # 证书的稳定标识
          certificate: "${APP_DATA:-.local/data}/ssl/fullchain.pem" # TLS 证书路径或 URI
          private-key: "${APP_DATA:-.local/data}/ssl/privkey.pem" # TLS 私钥路径或 URI
      default-certificate: "default" # 未匹配 SNI 时使用的证书 ID
      poll-interval: 3s # 证书来源兜底轮询间隔
      retry-interval: 0s # 证书重载失败后的重试间隔

    # 可信 HTTP 反向代理 CIDR/IP 列表
    trusted-proxies: []
    read-timeout: 15s # HTTP 读取超时时间
    write-timeout: 30s # HTTP 写入超时时间
    idle-timeout: 2m0s # HTTP 空闲连接超时时间
    max-api-body-bytes: 1048576 # HTTP API 最大请求体字节数，0 表示不限制
